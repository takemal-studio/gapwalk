<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>GAPWALK</title>
    <!--
      GAPWALK の Web 版のページ（段階 6。Unity の Minimal テンプレートをもとにした）。
      ゲームの画面をブラウザの窓いっぱいに広げる（固定の 960×600 だと、小さい窓ではみ出してスクロールが出たため）。
      迷路は画面の比率に合わせて収まる（D058）ので、どの窓の大きさでも欠けない。読み込み中は進み具合のバーだけを出す。
      スマホ（3.5）: 指の操作をゲームだけに渡す。画面を指で動かす・つまんで拡大する・二度たたいて拡大する（touch-action）、
      引っぱって画面ごと動く（overscroll-behavior）、長押しで文字の選択や吹き出しが出る（user-select・touch-callout）、
      たたいた所が灰色に光る（tap-highlight）を止める。iPhone の Safari は viewport の user-scalable=no を無視するので、CSS でも止める。
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #03170d;
                   overscroll-behavior: none; -webkit-user-select: none; user-select: none;
                   -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #03170d; outline: none; touch-action: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(60vw, 360px); text-align: center;
                 font-family: system-ui, sans-serif; color: #9ef273; letter-spacing: 0.2em; font-size: 14px; }
      #loading-bar { margin-top: 12px; height: 6px; border: 1px solid #9ef273; }
      #loading-fill { width: 0%; height: 100%; background: #9ef273; }
      #error { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px; background: #4a0d0d; color: #fff;
               font-family: system-ui, sans-serif; font-size: 12px; text-align: left; white-space: pre-wrap; word-break: break-all;
               max-height: 60vh; overflow: auto; -webkit-user-select: text; user-select: text; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">LOADING<div id="loading-bar"><div id="loading-fill"></div></div></div>
    <div id="error"></div>
    <script src="Build/2e049e98cefc9caf8320bfff6f8bade8.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");

      // エラーは画面の下に出す。起きた場所の一覧（stack）があれば続けて出す（iPhone では PC から中身を見られないので、写真に撮ってもらう。D093）。
      // 2 つ目からは後ろに足していく（最初のエラーが原因で、後のエラーはその結果のことが多いので、最初の物を消さない）
      function showError(message) {
        var box = document.querySelector("#error");
        box.textContent = box.style.display === "block" ? box.textContent + "\n----\n" + message : message;
        box.style.display = "block";
      }

      window.addEventListener("error", function (e) {
        var stack = e.error && e.error.stack ? "\n" + e.error.stack : "";
        var where = e.filename ? "\n(" + e.filename + ":" + e.lineno + ":" + e.colno + ")" : "";
        showError((e.message || "error") + where + stack);
      });
      window.addEventListener("unhandledrejection", function (e) {
        var reason = e.reason;
        showError("unhandled rejection: " + (reason && reason.stack ? reason.stack : reason));
      });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/9bf23463bd8bdec4f7f454a68bd9387c.data.unityweb",
        frameworkUrl: "Build/d25ba467e7a56ff6ad92506c6c01d2e2.framework.js.unityweb",
        codeUrl: "Build/443345e51ada59d02e6a163f131e5a56.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "takemal-studio",
        productName: "GAPWALK",
        productVersion: "1.0.4",
        showBanner: function (message, type) { if (type === "error") showError(message); },
      }, function (progress) {
        fill.style.width = (100 * progress) + "%";
      }).then(function () {
        loading.style.display = "none";
        // キーボードの入力がゲームに届くよう、画面に入力を向ける
        canvas.focus();
      }).catch(function (message) {
        loading.style.display = "none";
        showError(message);
      });
    </script>
  </body>
</html>
