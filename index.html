<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>GAPWALK</title>
    <!--
      GAPWALK の Web 版のページ（段階 6。Unity の Minimal テンプレートをもとにした）。
      ゲームの画面をブラウザの窓いっぱいに広げる（固定の 960×600 だと、小さい窓ではみ出してスクロールが出たため）。
      迷路は画面の比率に合わせて収まる（D058）ので、どの窓の大きさでも欠けない。読み込み中は進み具合のバーだけを出す。
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #03170d; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #03170d; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(60vw, 360px); text-align: center;
                 font-family: system-ui, sans-serif; color: #9ef273; letter-spacing: 0.2em; font-size: 14px; }
      #loading-bar { margin-top: 12px; height: 6px; border: 1px solid #9ef273; }
      #loading-fill { width: 0%; height: 100%; background: #9ef273; }
      #error { display: none; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px; background: #4a0d0d; color: #fff;
               font-family: system-ui, sans-serif; font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">LOADING<div id="loading-bar"><div id="loading-fill"></div></div></div>
    <div id="error"></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");

      function showError(message) {
        var box = document.querySelector("#error");
        box.textContent = message;
        box.style.display = "block";
      }

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "takemal-studio",
        productName: "GAPWALK",
        productVersion: "1.0.0",
        showBanner: function (message, type) { if (type === "error") showError(message); },
      }, function (progress) {
        fill.style.width = (100 * progress) + "%";
      }).then(function () {
        loading.style.display = "none";
        // キーボードの入力がゲームに届くよう、画面に入力を向ける
        canvas.focus();
      }).catch(function (message) {
        loading.style.display = "none";
        showError(message);
      });
    </script>
  </body>
</html>
